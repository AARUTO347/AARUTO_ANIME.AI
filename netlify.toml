[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "20.11.1" }

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Server-only variables go here / in Site Settings — NEVER commit secrets:
# GROQ_API_KEY, GROQ_TEXT_MODEL, POLLINATIONS_API_KEY
# ADMIN_EMAIL, ADMIN_PASSWORD_SCRYPT
